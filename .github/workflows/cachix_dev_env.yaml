name: "Update cachix cache for development environment"

on:
  push:
    branches: [rix-env]
    paths:
      - default.nix
      - generate_env.R
      - .github/workflows/cachix_dev_env.yaml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  r-update-cachix:
    if: github.repository != 'microbiome/OMA'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - uses: cachix/cachix-action@v17
        with:
          name: microbiome-oma
          authToken: "${{ secrets.CACHIX_AUTH }}"

      - run: nix-build default.nix

      - run: nix-store -qR --include-outputs $(nix-instantiate default.nix) | cachix push microbiome-oma

      - run: nix-shell --run "echo OK"
